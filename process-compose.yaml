version: "0.5"

processes:
  infra:
    command: make infra-up
    availability:
      restart: on_failure
      backoff_seconds: 2
      max_restarts: 3

  migrate:
    command: make migrate-up
    depends_on:
      infra:
        condition: process_completed_successfully

  api:
    command: air
    working_dir: ./api
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://${POSTGRES_USER:-meme}:${POSTGRES_PASSWORD:-meme}@${POSTGRES_HOST:-localhost}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-meme_portal}?sslmode=disable
      - REDIS_ADDR=${REDIS_HOST:-localhost}:${REDIS_PORT:-6379}
      - S3_ENDPOINT=localhost:3900
      - S3_REGION=${S3_REGION:-garage}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-GK4f8e1c2a9b3d7e6051c2f3a4b5c6d7e8}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-9a17c3e84b02f5d16a7c93e8b402f1d5a6c8e793b204d5f18e7a9c3b2d4f6e081}
      - S3_BUCKET=${S3_BUCKET:-meme-portal}
      - S3_USE_SSL=false
    depends_on:
      migrate:
        condition: process_completed_successfully

  web:
    command: bun run dev
    working_dir: ./web
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    depends_on:
      infra:
        condition: process_completed_successfully
